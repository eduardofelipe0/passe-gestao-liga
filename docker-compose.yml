services:
  db:
    image: postgres:16-alpine
    container_name: passe_postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: passe_db
      POSTGRES_USER: passe_user
      POSTGRES_PASSWORD: passe_dev_password

    ports:
      - "5433:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U passe_user -d passe_db"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data: